<!DOCTYPE html>

        <div class="user">
            <button class="user-button">
            <img class="userimage" src="../../image/user.png">
            <div class="user-info" id="user-info">
               <!-- Ονοματεπώνυμο -->
            </div>
            </button>
         <div class="popup-menu">

                <li onclick="window.location.href='../management/management.html'"> <img class="icon" src="../../image/project.png" alt="Project"> Διαχείριση διπλωματικής εργασίας</li>
                <li onclick="window.location.href='../message/message.html'"> <img class="icon" src="../../image/messages.png" alt="Μηνύματα"> Μηνύματα</li>
                <li onclick="window.location.href='../../login/Login.html'"> <img class="icon" src="../../image/exit.png" alt="Έξοδος"> Έξοδος</li>
            </ul>
        </div>
        </div>
    </header>
    <div class="main">
        <div class="section-left">
            <h3 class="menu-left" onclick="window.location.href='../themata_projection/themata_projection.html'"> Προβολή και Δημιουργία Θέματος</h3>

        </div>
        <div class="section-right">
            <h2>Δημιουργία θέματος</h2>
            <form id="assigmentStudent">
                <label for="student_id" >Αριθμός Μητρώου:</label>
                <input type="text" id="student_id" name="student_id" placeholder="Εισάγετε τον αριθμό μητρώου" autocomplete="off">
                    <ul id="suggestions" class="suggestions-list"></ul>

                <label for="student_name">Ονοματεπώνυμο:</label>
                <input type="text" id="student_name" name="student_name" placeholder="Εισάγετε το ονοματεπώνυμο" autocomplete="off">
                    <ul id="nameSuggestions" class="suggestions-list"></ul>

                <label for="diploma_title">Τίτλος Διπλωματικής:</label>
                <input type="text" id="diploma_title" name="diploma_title" placeholder="Εισάγετε τον τίτλο" autocomplete="off">
                    <ul id="titleSuggestions" class="suggestions-list"></ul>
                <input type="hidden" id="themata_a_id" name="themata_a_id">



                <button class="button-all" type="button" id="submitBtn">Υποβολή</button>
            </form>
