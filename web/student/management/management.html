<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Η Διπλωματική Μου</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> 
</head>
<body>
<header class="header">
    <img class="logo" onclick="window.location.href='../student_arxiki.html'" src="../../image/Upatras.png" alt="Upatras">
    <img class="pap" onclick="window.location.href='../student_arxiki.html'" src="../../image/Upatrasl.png" alt="Upatras">
    <div class="user">
        <button class="user-button">
            <img class="userimage" src="../../image/user.png">
            <div class="user-info" id="user-info"></div>
        </button>
        <div class="popup-menu">
            <ul>
                <li onclick="window.location.href='../profil.html'"><img class="icon" src="../../image/profile.png" alt="Προφίλ">Προφίλ</li>
                <li onclick="window.location.href='../../login/Login.html'"><img class="icon" src="../../image/exit.png" alt="Προφίλ">Έξοδος</li>
            </ul>
        </div>
    </div>
</header>

<div class="main">
    <div class="section-left">
        <h3 class="menu-left" onclick="window.location.href='../de_projection/de_projection.html'">Προβολή Θέματος</h3>
        <h3 class="menu-left" onclick="window.location.href='management.html'">Προβολή Διπλωματικής</h3>
    </div>
    <div class="section-right">
         <div class="categories"></div>
         <div id="section-ypo-anathesi">
            <h2>Υπο Ανάθεση</h2>

            <div class="topics">
                    <ul id="de_ypo">  <!--Θέματα υπο ανάθεση-->
                    </ul>
            </div> 

            <h2>Πρόσκληση Μελών Τριμελούς</h2>
            <div class="topics">
                <div id="invite-section">
                    <ul id="professor-list"> <!--Η λίστα καθηγητών με το κουμπί για προσκληση-->
                    </ul>
                </div>

                <h3>Απεσταλμένες Προσκλήσεις</h3>
                <ul id="sent-invitations">  <!--Οι προσκλήσεις-->
                </ul>
            </div>
        </div>
        <div id="section-energi">
            <h2>Ενεργές</h2>
            <div class="topics">
                <ul id="active-diplomas"> <!--Οι ενεργές διπλωματικές-->
                </ul>
            </div>
        </div>
        <div id="section-exetasi">
            <h2>Υπό Εξέταση</h2>
            <div class="topics">
                <form id="exetasi-form" enctype="multipart/form-data">
                    <label for="file">Ανέβασε πρόχειρο αρχείο (PDF, Word):</label><br> 
                    <input type="file" name="file" id="file"><br><br>

                    <label for="links">Σύνδεσμος εξωτερικού υλικού:</label><br>
                    <textarea name="links" id="links" rows="3" style="width: 100%;"></textarea><br><br>

                    <button type="submit">Αποθήκευση</button>
                    <hr style="margin: 20px 0;">
                </form> <!--Ανεβάζεις το υλικό προς εξέταση και το αποθηκεύεις-->

                <div id="exetasi-result" style="margin-top: 10px; color: green;"></div>
            </div>
            <h3>Καταχώρηση Στοιχείων Εξέτασης</h3>
            <form id="exam-info-form">
                <label for="exam_datetime">Ημερομηνία & Ώρα Εξέτασης:</label><br>
                <input type="datetime-local" name="exam_datetime" id="exam_datetime" required><br><br>
                <!--Καταχώρηση Ημερομηνίας και ώρας για εξέταση-->
                <label>Τρόπος Εξέτασης:</label><br>
                <select name="method" id="method" required>
                    <option value="">-- Επιλέξτε --</option>
                    <option value="Δια ζώσης">Δια ζώσης</option>
                    <option value="Διαδικτυακά">Διαδικτυακά</option>
                </select><br><br>
                <!--Επιλογή τρόπου εξέτασης-->
                <label for="details">Αίθουσα ή Σύνδεσμος:</label><br>
                <input type="text" name="details" id="details" required style="width: 100%;"><br><br>

                <button type="submit">Αποθήκευση</button>
                <hr style="margin: 20px 0;">
            </form> 

            <div id="exam-info-result" style="margin-top: 10px; color: green;"></div>
            
            <h3>Πρακτικό Εξέτασης</h3>
                <div id="praktiko-section">

                </div>

                <h3>Νημερτή</h3>
                <div id="nimertis-section">
                    <form id="nimertis-form">
                        <input type="url" id="nimertis-link" name="link" style="width: 100%;" required>
                        <br><br>
                        <button type="submit">Αποθήκευση</button>
                    </form>
                    <div id="nimertis-result" style="margin-top: 10px;"></div>
                </div>
            </div>
            <div id="section-peratomeni">
                <h2>Περατωμένες</h2>
            <div id="completed-section" class="topics">
               
            </div>
        </div>

    </div>
</div>
<script src="management.js"></script>
</body>
</html>
